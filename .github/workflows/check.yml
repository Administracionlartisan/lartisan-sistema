# Verificación automática de cada cambio (incluidos los propuestos por agentes).
# Con protección de rama en GitHub, un cambio que no pase no puede unirse a main.
name: Verificación completa

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, openssl, curl
      - run: npm ci
      - run: npm run check
